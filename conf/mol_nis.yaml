# config.yaml
defaults:
  - _self_
  - task: molecular_nis
  - sampler_net: rbm
  - ansatz: mlp

hydra:
  run:
    # Structure logs by Molecule ID, Network Type, and Date
    dir: outputs/${system.cid}/${ansatz.name}/${sampler_net.name}/${now:%Y-%m-%d_%H-%M}

system:
  cid: 62714 # LiH
  basis: "STO-3G"
  cache_dir: "/leonardo_work/EUHPC_A05_006/NeurIS/qchem_utils/pubchem_cache"

exact_sampling: true

training:
  n_s: 1024
  seed: 0
  
  pretrain:
    iterations: 100
    lr: 0.05
    diag_shift: 1e-4
    use_ngd_sampler: false
    use_ngd_wf: false
    diag_shift_p: 1e-2 # Specific shift for Backflow pre-training
  
  vmc:
    iterations: 1000
    lr_start: 5e-2
    lr_end: 1e-2
    diag_shift: 1e-5
  
  nis:
    iterations: 1
    lr_start: 1e-2
    lr_end: 7e-3
    diag_shift: 1e-5