# config.yaml
defaults:
  - _self_
  - task: hubbard_nis
  - sampler_net: rbm
  - ansatz: vit

hydra:
  run:
    # Structure logs by Molecule ID, Network Type, and Date
    dir: outputs/hubbard_${system.graph}/${sampler_net.name}/${training.n_s}/${now:%Y-%m-%d_%H-%M}
outdir:  outputs/hubbard_${system.graph}/${sampler_net.name}/${training.n_s}/${now:%Y-%m-%d_%H-%M}

system:
  graph: "cylinder"
  Lx: 8
  Ly: 4
  U: 8
  t: 1

exact_sampling: false

training:
  n_s: 1024
  seed: 0
  
  pretrain:
    iterations: 100
    lr: 0.05
    diag_shift: 1e-4
    use_ngd_sampler: false
    use_ngd_wf: false
    diag_shift_p: 1e-2 # Specific shift for Backflow pre-training
  
  vmc:
    iterations: 3000
    lr_start: 5e-2
    lr_end: 1e-2
    diag_shift: 1e-5
  
  nis:
    iterations: 1
    update_fn: 'snr_mat_sr'
    lr_start: 1e-2
    lr_end: 7e-3
    diag_shift: 1e-5